name: V2 Preview Quality
on:
  push:
    branches: [codex/portal-v2-evidence-graph]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run verify
