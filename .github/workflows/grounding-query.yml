name: Grounding Query

on:
  pull_request:
    paths:
      - 'api/graph.js'
      - 'lib/grounding.js'
      - 'scripts/grounding-query-contract.mjs'
      - '.github/workflows/grounding-query.yml'
  push:
    branches: [main]
    paths:
      - 'api/graph.js'
      - 'lib/grounding.js'
      - 'scripts/grounding-query-contract.mjs'
      - '.github/workflows/grounding-query.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --check api/graph.js && node --check lib/grounding.js && node --check scripts/grounding-query-contract.mjs
      - run: node scripts/grounding-query-contract.mjs
