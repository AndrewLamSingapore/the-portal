name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run verify

  production-smoke:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Wait for production deployment
        if: github.event_name == 'push'
        run: sleep 45
      - name: Verify live production
        env:
          PORTAL_URL: https://the-portal-ten.vercel.app
          SMOKE_TIMEOUT_MS: '15000'
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Production verification attempt $attempt/5"
            if npm run smoke:production; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then sleep 30; fi
          done
          exit 1
