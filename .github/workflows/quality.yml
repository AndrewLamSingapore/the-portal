name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run verify

  production-smoke:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install smoke-test browser
        run: npx playwright install --with-deps chromium
      - name: Verify live production
        env:
          PORTAL_URL: https://the-portal-ten.vercel.app
          SMOKE_TIMEOUT_MS: '15000'
          DEPLOY_TIMEOUT_MS: '240000'
          EXPECTED_REVISION: ${{ github.sha }}
        run: npm run smoke:production
