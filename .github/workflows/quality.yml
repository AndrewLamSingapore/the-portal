name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check inhabitants.js && node --check scripts/inhabitants-smoke.mjs
      - run: npm run verify
      - name: Verify shared admission on disposable PostgreSQL
        env:
          PORTAL_ADMISSION_TEST_CONTAINER: abex-portal-admission-ci
        run: |
          docker run -d --rm --name "$PORTAL_ADMISSION_TEST_CONTAINER" --label portal.admission-test=1 --network none --memory=384m --cpus=1 --volume /var/lib/postgresql/data -e POSTGRES_HOST_AUTH_METHOD=trust postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          trap 'docker rm -f -v "$PORTAL_ADMISSION_TEST_CONTAINER" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 40); do
            if docker exec "$PORTAL_ADMISSION_TEST_CONTAINER" pg_isready -U postgres; then break; fi
            sleep 1
          done
          npm run test:admission:postgres
      - run: npm run synthetic:result
      - name: Verify the PRIME authorization contract
        run: npm run prime:authorization
      - name: Verify the PRIME publish contract
        run: npm run prime:publish
      - name: Install recovery-test browser
        run: npx playwright install --with-deps chromium
      - name: Verify fresh card links and homepage opening
        run: npm run smoke:card-links
      - name: Verify PRIME password recovery submission
        run: npm run prime:recovery

  production-smoke:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install smoke-test browser
        run: npx playwright install --with-deps chromium
      - name: Wait for production deployment
        if: github.event_name == 'push'
        run: sleep 45
      - name: Verify live production
        env:
          PORTAL_URL: https://the-portal-ten.vercel.app
          SMOKE_TIMEOUT_MS: '15000'
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Production verification attempt $attempt/5"
            if npm run smoke:production && node scripts/inhabitants-smoke.mjs; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then sleep 30; fi
          done
          exit 1
      - name: Verify the deployed PRIME recovery submit path
        env:
          PRIME_BASE: https://the-portal-ten.vercel.app
        run: npm run prime:recovery
