<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>THE PORTAL · Living Observatory</title><link rel="stylesheet" href="/styles.css"><style>body{padding:0 5vw 6rem}.wrap{max-width:1120px;margin:auto}.living-head{margin:8vh auto 4rem}.living-head h1{font-size:clamp(3rem,9vw,8rem);line-height:.85;margin:.4rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}.card,.continuity{border:1px solid #5c5144;padding:1.1rem;background:#0b0907}.continuity{border-width:2px}.tag{font:12px monospace;letter-spacing:.06em}.section{margin:3rem auto;border-top:1px solid #5c5144;padding-top:2rem}.lineage{border-left:2px solid #5c5144}.reborn{border-width:2px}input,button{font:inherit;padding:.8rem;margin:.3rem 0;width:100%;box-sizing:border-box}button{cursor:pointer}</style></head><body><header class="living-head wrap"><p class="tag">PORTAL 6.3 · COMPLETE LIVING SANDBOX</p><h1>LIVING<br>OBSERVATORY</h1><div class="continuity" id="continuity">AWAKENING…</div></header><main class="wrap"><section class="section"><div class="grid"><article class="card"><p class="tag">EVIDENCE INTAKE</p><h3>Introduce a new observation</h3><input id="obs" placeholder="e.g. cleaning the flow path restores recovery"><button id="send">INGEST EVIDENCE</button><p id="intake"></p></article><article class="card" id="questions"></article><article class="card" id="meta"></article></div></section><section id="generations"></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const d=await fetch('/api/living').then(r=>r.json()),p=d.persistence,s=d.experiment_summary;continuity.innerHTML=`<p class="tag">${esc(d.version)} · ${esc(d.generation_mode)}</p><h2>${p.selective?'SELECTIVE MYCELIAL AWAKENING':p.resumed?'ORGANISM RESUMED':'NEW ORGANISM'}</h2><p>Run ${esc(p.run_id)} · organism generation ${p.organism_generation} · database ${p.database?'CONNECTED':'UNAVAILABLE'} · ${p.persisted?'SAVED':'EPHEMERAL'}</p><p>${p.pending_consumed||0} observations consumed · ${p.unaffected_preserved||0} unaffected lineages preserved · ${s.total} experiments</p>`;generations.innerHTML=d.generations.map(g=>`<section class="section"><h2>Generation ${g.generation}</h2><p class="tag">EXTINCT ${g.extinct.map(esc).join(' · ')||'NONE'} · REBORN ${g.reborn.map(esc).join(' · ')||'NONE'}</p><div class="grid">${g.population.map(h=>`<article class="card lineage ${h.state==='REBORN'?'reborn':''}"><p class="tag">${esc(h.state)} · ${esc(h.epistemic_class)}</p><h3>${esc(h.id)}</h3><p>${esc(h.statement)}</p><p><b>Parents</b> ${h.ancestry.parent_ids.map(esc).join(' + ')}</p><p><b>Confidence</b> ${Math.round(h.confidence*100)}%</p></article>`).join('')}</div></section>`).join('');questions.innerHTML=`<p class="tag">PROSPECTIVE MEMORY</p><h3>Unfinished questions</h3>${p.unfinished_questions.map(q=>`<p>${esc(q)}</p>`).join('')}`;meta.innerHTML=`<p class="tag">METACOGNITION</p><p>${esc(d.cognition.metacognition.question)}</p><p>REAL-WORLD ACTION BLOCKED</p>`}send.onclick=async()=>{const summary=obs.value.trim();if(!summary)return;intake.textContent='ROUTING EVIDENCE…';const r=await fetch('/api/living-observe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({summary,source:'OBSERVATORY_USER'})}),d=await r.json();intake.textContent=d.decision?`${d.decision.wake?'WAKE':'STORE'} · novelty ${Math.round(d.decision.change.novelty*100)}% · ${d.decision.reason}`:(d.error||'error');if(d.decision?.wake)await load()};load().catch(e=>continuity.textContent='SANDBOX UNAVAILABLE · '+e.message)</script></body></html>
