<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>THE PORTAL · Living Observatory</title><link rel="stylesheet" href="/styles.css"><style>body{padding:0 5vw 6rem}.wrap{max-width:1120px;margin:auto}.living-head{margin:8vh auto 4rem}.living-head h1{font-size:clamp(3rem,9vw,8rem);line-height:.85;margin:.4rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}.card{border:1px solid #5c5144;padding:1.1rem;background:#0b0907}.tag,.outcome{font:12px monospace;letter-spacing:.06em}.section{margin:3rem auto;border-top:1px solid #5c5144;padding-top:2rem}.gen{margin:2rem 0}.lineage{border-left:2px solid #5c5144}.extinct{opacity:.45;text-decoration:line-through}.surprise{border-style:dashed}.reborn{border-width:2px}.risk{opacity:.75}</style></head><body><header class="living-head wrap"><p class="tag">PORTAL 6.3 · EVOLUTION WITH FOSSIL MEMORY</p><h1>LIVING<br>OBSERVATORY</h1><p id="state">REMEMBERING EXTINCTIONS…</p><p id="summary"></p></header><main class="wrap"><section id="generations"></section><section class="section"><div class="grid"><article class="card" id="meta"></article><article class="card" id="tools"></article><article class="card" id="critics"></article></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/living').then(r=>r.json()).then(d=>{const s=d.experiment_summary;state.textContent=`${d.version} · FOSSIL INHERITANCE ACTIVE · PRODUCTION BLOCKED`;summary.textContent=`${s.total} experiments · ${s.extinctions.length} extinctions · ${s.fossils} fossils · ${s.surprise_branches.length} surprises · ${s.rebirths.length} controlled rebirths`;generations.innerHTML=d.generations.map(g=>`<section class="section gen"><h2>Generation ${g.generation}</h2><p class="tag">FOSSILS ${g.fossil_count} · EXTINCT ${g.extinct.map(esc).join(' · ')||'NONE'} · REBORN ${g.reborn.map(esc).join(' · ')||'NONE'}</p><div class="grid">${g.population.map(h=>`<article class="card lineage ${h.id.includes('SURPRISE')?'surprise':''} ${h.state==='REBORN'?'reborn':''}"><p class="tag">${esc(h.state)} · ${esc(h.epistemic_class)}</p><h3>${esc(h.id)}</h3><p>${esc(h.statement)}</p><p><b>Parents</b> ${h.ancestry.parent_ids.map(esc).join(' + ')}</p><p><b>Operator</b> ${esc(h.ancestry.operators.join(' + '))}</p><p><b>Confidence</b> ${Math.round(h.confidence*100)}%</p></article>`).join('')}</div><h3>Selection pressure</h3>${g.experiments.map(e=>`<p class="outcome ${e.state==='DEAD'?'extinct':''}">${esc(e.candidate_id)} → ${esc(e.outcome.polarity)} · ${Math.round(e.confidence*100)}%${e.fossil_risk?` · fossil risk ${Math.round(e.fossil_risk*100)}% from ${e.fossil_matches.map(esc).join(', ')}`:''}</p>`).join('')}</section>`).join('');const c=d.cognition;meta.innerHTML=`<p class="tag">METACOGNITION</p><p>${esc(c.metacognition.question)}</p>`;tools.innerHTML=`<p class="tag">TOOLS</p>${c.selected_tools.map(t=>`<p>${esc(t.id)}</p>`).join('')}`;critics.innerHTML=`<p class="tag">CRITICS</p>${c.critics.slice(0,4).map(q=>`<p>${esc(q.attacks[0])}</p>`).join('')}`}).catch(e=>state.textContent='SANDBOX UNAVAILABLE · '+e.message)</script></body></html>
