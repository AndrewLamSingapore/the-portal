<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>THE PORTAL · Living Observatory</title><link rel="stylesheet" href="/styles.css"><style>body{padding:0 5vw 6rem}.wrap{max-width:1120px;margin:auto}.living-head{margin:8vh auto 4rem}.living-head h1{font-size:clamp(3rem,9vw,8rem);line-height:.85;margin:.4rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}.card{border:1px solid #5c5144;padding:1.1rem;background:#0b0907}.tag,.outcome{font:12px monospace;letter-spacing:.06em}.section{margin:3rem auto;border-top:1px solid #5c5144;padding-top:2rem}.lineage{border-left:2px solid #5c5144}.extinct{opacity:.45;text-decoration:line-through}.reborn{border-width:2px}.continuity{border:2px solid #5c5144;padding:1.2rem}</style></head><body><header class="living-head wrap"><p class="tag">PORTAL 6.3 · PERSISTENT LIVING SANDBOX</p><h1>LIVING<br>OBSERVATORY</h1><div class="continuity" id="continuity">LOADING ORGANISM MEMORY…</div></header><main class="wrap"><section id="generations"></section><section class="section"><div class="grid"><article class="card" id="questions"></article><article class="card" id="meta"></article><article class="card" id="tools"></article></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/living').then(r=>r.json()).then(d=>{const p=d.persistence,s=d.experiment_summary;continuity.innerHTML=`<p class="tag">${esc(d.version)} · ${esc(d.generation_mode)}</p><h2>${p.resumed?'ORGANISM RESUMED':'NEW ORGANISM'}</h2><p>Run ${esc(p.run_id)} · organism generation ${p.organism_generation} · durable database ${p.database?'CONNECTED':'UNAVAILABLE'} · state ${p.persisted?'SAVED':'EPHEMERAL'}</p><p>${s.total} experiments this awakening · ${s.extinctions.length} extinctions · ${s.rebirths.length} rebirths</p>`;generations.innerHTML=d.generations.map(g=>`<section class="section"><h2>Awakening generation ${g.generation}</h2><p class="tag">FOSSILS ${g.fossil_count} · EXTINCT ${g.extinct.map(esc).join(' · ')||'NONE'} · REBORN ${g.reborn.map(esc).join(' · ')||'NONE'}</p><div class="grid">${g.population.map(h=>`<article class="card lineage ${h.state==='REBORN'?'reborn':''}"><p class="tag">${esc(h.state)} · ${esc(h.epistemic_class)}</p><h3>${esc(h.id)}</h3><p>${esc(h.statement)}</p><p><b>Parents</b> ${h.ancestry.parent_ids.map(esc).join(' + ')}</p><p><b>Confidence</b> ${Math.round(h.confidence*100)}%</p></article>`).join('')}</div></section>`).join('');questions.innerHTML=`<p class="tag">PROSPECTIVE MEMORY</p><h3>Unfinished questions</h3>${p.unfinished_questions.map(q=>`<p>${esc(q)}</p>`).join('')}`;meta.innerHTML=`<p class="tag">METACOGNITION</p><p>${esc(d.cognition.metacognition.question)}</p><p>REAL-WORLD ACTION BLOCKED</p>`;tools.innerHTML=`<p class="tag">TOOLS</p>${d.cognition.selected_tools.map(t=>`<p>${esc(t.id)}</p>`).join('')}`}).catch(e=>continuity.textContent='SANDBOX UNAVAILABLE · '+e.message)</script></body></html>
