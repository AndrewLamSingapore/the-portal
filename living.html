<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>THE PORTAL · Living Observatory</title><link rel="stylesheet" href="/styles.css"><style>body{padding:0 5vw 6rem}.wrap{max-width:1100px;margin:auto}.living-head{margin:8vh auto 4rem}.living-head h1{font-size:clamp(3rem,9vw,8rem);line-height:.85;margin:.4rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1rem}.card{border:1px solid #5c5144;padding:1.2rem;background:#0b0907}.meter{height:6px;background:#29231d}.meter i{display:block;height:100%;background:#c7b08a}.tag{font:12px monospace;letter-spacing:.08em}.section{margin:3rem auto;border-top:1px solid #5c5144;padding-top:2rem}.trace{font-family:monospace;font-size:.82rem}.dead{opacity:.55}</style></head><body><header class="living-head wrap"><p class="tag">PORTAL 6.3 · ISOLATED PREVIEW</p><h1>LIVING<br>OBSERVATORY</h1><p id="state">AWAKENING GENERATIVE CORTEX…</p></header><main class="wrap"><section class="section"><p class="tag">ORIGINATED POPULATION</p><div class="grid" id="population"></div><p id="synthesis"></p></section><section class="section"><p class="tag">EXECUTIVE CYCLE</p><div class="grid"><article class="card"><h2>Metacognition</h2><div id="meta"></div></article><article class="card"><h2>Selected tools</h2><div id="tools"></div></article><article class="card"><h2>Recalled memory</h2><div id="memory"></div></article></div></section><section class="section"><p class="tag">EVOLUTIONARY ECOLOGY</p><div class="grid" id="niches"></div></section><section class="section"><p class="tag">CO-EVOLVING CRITICS</p><div class="grid" id="critics"></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/living').then(r=>r.json()).then(d=>{const c=d.cognition,p=d.generated?.candidates||d.result.population;state.textContent=`${d.version} · ${d.generation_mode} · REAL-WORLD MUTATION BLOCKED`;population.innerHTML=p.map(h=>`<article class="card ${h.state==='DEAD'?'dead':''}"><p class="tag">${esc(h.niche||h.state)} · ${esc(h.epistemic_class)}</p><h2>${esc(h.statement)}</h2><div class="meter"><i style="width:${Math.round(h.confidence*100)}%"></i></div><p>${Math.round(h.confidence*100)}% confidence</p><p><b>Ancestry</b><br>${h.ancestry.parent_ids.map(esc).join(' → ')}</p><p><b>Prediction</b><br>${esc(h.predictions[0])}</p><p><b>Falsifier</b><br>${esc(h.falsifiers[0])}</p>${h.discriminating_test?`<p><b>Discriminating test</b><br>${esc(h.discriminating_test)}</p>`:''}</article>`).join('');synthesis.textContent=d.generated?`${d.generated.synthesis} Next question: ${d.generated.next_question}`:`Deterministic fallback active${d.generation_error?': '+d.generation_error:''}.`;meta.innerHTML=`<p>Uncertainty ${Math.round(c.metacognition.uncertainty*100)}%</p><p>${esc(c.metacognition.question)}</p><p class="tag">ACTION ${c.metacognition.should_act?'ALLOWED':'BLOCKED'}</p>`;tools.innerHTML=c.selected_tools.map(t=>`<p><b>${esc(t.id)}</b><br>${esc(t.capability)}</p>`).join('');memory.innerHTML=c.recalled.map(m=>`<p><b>${esc(m.layer)}</b><br>${esc(typeof m.content==='string'?m.content:JSON.stringify(m.content))}</p>`).join('')||'<p>No matching memory.</p>';niches.innerHTML=c.evolutionary_frontier.map(n=>`<article class="card"><p class="tag">${esc(n.niche)}</p><h3>${esc(n.parent)}</h3><p class="trace">${esc(JSON.stringify(n.fitness))}</p></article>`).join('');critics.innerHTML=c.critics.slice(0,8).map(q=>`<article class="card"><p class="tag">${esc(q.id)}</p><p>${esc(q.attacks[0])}</p><p>${esc(q.attacks[1])}</p></article>`).join('')}).catch(e=>state.textContent='SANDBOX UNAVAILABLE · '+e.message)</script></body></html>
