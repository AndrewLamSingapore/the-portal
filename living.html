<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>THE PORTAL · Living Observatory</title><link rel="stylesheet" href="/styles.css"><style>body{padding:0 5vw 6rem}.wrap{max-width:1120px;margin:auto}.living-head{margin:8vh auto 4rem}.living-head h1{font-size:clamp(3rem,9vw,8rem);line-height:.85;margin:.4rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}.card{border:1px solid #5c5144;padding:1.1rem;background:#0b0907}.tag{font:12px monospace;letter-spacing:.08em}.section{margin:3rem auto;border-top:1px solid #5c5144;padding-top:2rem}.trace{font:12px monospace;overflow-wrap:anywhere}.gen{margin:2rem 0}.lineage{border-left:2px solid #5c5144;padding-left:1rem}</style></head><body><header class="living-head wrap"><p class="tag">PORTAL 6.3 · ISOLATED EVOLUTIONARY PREVIEW</p><h1>LIVING<br>OBSERVATORY</h1><p id="state">EVOLVING…</p></header><main class="wrap"><section class="section"><p class="tag">MULTI-GENERATION EVOLUTION</p><div id="generations"></div></section><section class="section"><p class="tag">EXECUTIVE / METACOGNITION</p><div class="grid"><article class="card" id="meta"></article><article class="card" id="tools"></article><article class="card" id="critics"></article></div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/living').then(r=>r.json()).then(d=>{state.textContent=`${d.version} · ${d.generation_mode} · ${d.generations.length} GENERATIONS · PRODUCTION MUTATION BLOCKED`;generations.innerHTML=d.generations.map(g=>`<section class="gen"><h2>Generation ${g.generation}</h2><p class="tag">PARETO FRONTIER · ${g.frontier.map(esc).join(' · ')}</p><div class="grid">${g.population.map(h=>`<article class="card lineage"><p class="tag">${esc(h.niche||h.state)} · ${esc(h.epistemic_class)}</p><h3>${esc(h.id)}</h3><p>${esc(h.statement)}</p><p><b>Parents</b> ${h.ancestry.parent_ids.map(esc).join(' + ')}</p><p><b>Operator</b> ${esc(h.ancestry.operators.join(' + '))}</p><p><b>Confidence</b> ${Math.round(h.confidence*100)}%</p><p><b>Falsifier</b> ${esc(h.falsifiers[0])}</p></article>`).join('')}</div></section>`).join('');const c=d.cognition;meta.innerHTML=`<p class="tag">METACOGNITION</p><p>Uncertainty ${Math.round(c.metacognition.uncertainty*100)}%</p><p>${esc(c.metacognition.question)}</p><p>ACTION ${c.metacognition.should_act?'ALLOWED':'BLOCKED'}</p>`;tools.innerHTML=`<p class="tag">TOOLS CHOSEN</p>${c.selected_tools.map(t=>`<p><b>${esc(t.id)}</b><br>${esc(t.capability)}</p>`).join('')}`;critics.innerHTML=`<p class="tag">ACTIVE CRITICS</p>${c.critics.slice(0,4).map(q=>`<p>${esc(q.attacks[0])}</p>`).join('')}`}).catch(e=>state.textContent='SANDBOX UNAVAILABLE · '+e.message)</script></body></html>
