<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>THE PORTAL · Decisive Experiment</title><link rel="stylesheet" href="/styles.css"><style>body{padding:0 5vw 6rem}.wrap{max-width:1120px;margin:auto}.living-head{margin:8vh auto 4rem}.living-head h1{font-size:clamp(3rem,9vw,8rem);line-height:.85;margin:.4rem 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}.card,.verdict{border:1px solid #5c5144;padding:1.1rem;background:#0b0907}.verdict{border-width:2px}.tag{font:12px monospace;letter-spacing:.06em}.section{margin:3rem auto;border-top:1px solid #5c5144;padding-top:2rem}.pass{font-weight:700}input,button{font:inherit;padding:.8rem;margin:.3rem 0;width:100%;box-sizing:border-box}</style></head><body><header class="living-head wrap"><p class="tag">PORTAL 6.3 · DECISIVE EXPERIMENT</p><h1>LIVING<br>OBSERVATORY</h1><div class="verdict" id="verdict">RUNNING BLIND ACCEPTANCE PROTOCOL…</div></header><main class="wrap"><section class="section"><div class="grid"><article class="card"><p class="tag">EVIDENCE INTAKE</p><input id="obs" placeholder="Introduce contradictory or novel evidence"><button id="send">INGEST EVIDENCE</button><p id="intake"></p></article><article class="card" id="criteria"></article><article class="card" id="metrics"></article></div></section><section class="section" id="population"></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const d=await fetch('/api/living').then(r=>r.json()),v=d.decisive_experiment.verdict;verdict.innerHTML=`<p class="tag">${esc(v.protocol_id)} · BLIND ${v.blind?'YES':'NO'}</p><h2>${v.passed?'PASS':v.provisional?'PROVISIONAL — NOT PROVEN':'FAIL'}</h2><p>Score ${Math.round(v.score*100)}% · novelty ${Math.round(v.novelty_score*100)}%</p><p>${esc(v.reason)}</p>`;criteria.innerHTML=`<p class="tag">DECISIVE GATES</p>${Object.entries(v.criteria).map(([k,x])=>`<p class="${x?'pass':''}">${x?'PASS':'FAIL'} · ${esc(k.replaceAll('_',' '))}</p>`).join('')}`;metrics.innerHTML=`<p class="tag">TRIAL METRICS</p>${Object.entries(v.metrics).map(([k,x])=>`<p>${esc(k.replaceAll('_',' '))}: ${esc(x)}</p>`).join('')}<p>Generation mode: ${esc(d.generation_mode)}</p>`;const last=d.generations.at(-1);population.innerHTML=`<h2>Current evolutionary frontier</h2><div class="grid">${last.population.map(h=>`<article class="card"><p class="tag">${esc(h.state)} · ${esc(h.epistemic_class)}</p><h3>${esc(h.id)}</h3><p>${esc(h.statement)}</p><p>Confidence ${Math.round(h.confidence*100)}%</p><p><b>Falsifier</b> ${esc(h.falsifiers[0])}</p></article>`).join('')}</div>`}send.onclick=async()=>{const summary=obs.value.trim();if(!summary)return;const d=await fetch('/api/living',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({summary,source:'DECISIVE_EXPERIMENT'})}).then(r=>r.json());intake.textContent=d.decision?`${d.decision.wake?'WAKE':'STORE'} · novelty ${Math.round(d.decision.change.novelty*100)}% · ${d.decision.reason}`:(d.error||'error');if(d.decision?.wake)await load()};load().catch(e=>verdict.textContent='EXPERIMENT ERROR · '+e.message)</script></body></html>
